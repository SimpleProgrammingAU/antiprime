pre-commit:
  commands:
    format:
      priority: 1
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      priority: 2
      glob: "*.{js,ts}"
      run: pnpm exec eslint --fix --max-warnings 0 {staged_files}
      stage_fixed: true
    typecheck:
      priority: 3
      run: pnpm typecheck
    test:
      priority: 4
      glob: "src/**/*.ts"
      run: pnpm exec vitest related --run --passWithNoTests {staged_files}
